<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarma de Nexo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: white;
        background: radial-gradient(circle at 80% 0%, #0e7490 0, transparent 42%), linear-gradient(145deg, #020617, #312e81);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 100%; text-align: center; }
      .bell {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: rgba(255,255,255,.14);
        font-size: 36px;
        animation: ring .65s ease-in-out infinite alternate;
      }
      .eyebrow { margin: 0 0 6px; color: #67e8f9; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 23px; line-height: 1.2; }
      #message { min-height: 40px; margin: 10px auto 20px; color: #dbeafe; font-size: 14px; line-height: 1.45; }
      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 13px 18px;
        background: linear-gradient(90deg, #22d3ee, #818cf8);
        color: #082f49;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(34,211,238,.22);
      }
      #status { margin: 12px 0 0; color: #a5f3fc; font-size: 11px; }
      @keyframes ring { from { transform: rotate(-8deg) scale(.98); } to { transform: rotate(8deg) scale(1.04); } }
    </style>
  </head>
  <body>
    <main>
      <div class="bell" aria-hidden="true">⏰</div>
      <p class="eyebrow">Alarma programada</p>
      <h1 id="title">Recordatorio de Nexo</h1>
      <p id="message">Tienes un recordatorio pendiente.</p>
      <button id="acknowledge" type="button">OK · Detener alarma</button>
      <p id="status">La alarma seguirá sonando hasta que pulses OK</p>
    </main>
    <script src="reminder-alarm.js"></script>
  </body>
</html>
